# C2 P5+ external-baseline shard. The experiment harness requires
# a render budget divisible by each case panel count, so the full frozen
# 21-case C2 comparison is represented by P5 through P11 matrices.
# Credentials are environment-only: map the gateway into the adapter's
# OpenAI-compatible environment variables before --execute.
experiment_name: c2-baseline-nvagent-multipanel-p5-v1-gpt4omini
dataset_manifest: /mnt/shared/zechuan/pv-c2-baseline/repo-c2/nature_download/outputs/c2_extreme_proposals/proposed.jsonl
