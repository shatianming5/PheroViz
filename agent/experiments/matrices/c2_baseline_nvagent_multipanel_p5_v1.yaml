dataset_mode: legacy
artifact_root: /mnt/shared/zechuan/pv-c2-baseline/runs/c2_baseline_nvagent_multipanel_p5_v1_gpt4omini
provider_options:
  manifest_data_root: /mnt/shared/zechuan/pv-c2-baseline/repo-c2
methods:
- name: nvagent_multipanel
