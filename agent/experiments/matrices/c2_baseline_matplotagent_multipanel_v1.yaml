# Head-to-head on the C2 multi-panel testbed: an external SOTA chart-generation
# baseline (MatPlotAgent, run once per panel and aggregated with PheroViz's own
# multi-panel arithmetic) vs PheroViz, on the identical sealed multi-panel cases,
# scored by the identical app.evaluation programmatic evaluator.
#
# Backbone is held fixed at gpt-4o-mini for BOTH methods so the comparison
# isolates the METHOD effect (not model capability). Budget = 6 renders is exact
# for every case's panel count (6 / 2 / 3 all divide 6), giving each method the
# same number of figure attempts per case (best_of_{1,3,2}) under the scheduler's
# exact-fill semantics -- identical parity to the production C2 PheroViz matrix.
#
# Runs on the remote cluster. Paths below are cluster-absolute:
#   workspace = /mnt/shared/zechuan/pv-c2-baseline
#   repo      = /mnt/shared/zechuan/pv-c2-baseline/repo   (this repo, commit-pinned)
# The dataset_manifest is the provenance-free legacy view of the 3 sealed
# multi-panel cases produced by
#   experiments.baseline_specs.build_c2_multipanel_baseline_manifest
# with --rewrite-target-root /mnt/shared/zechuan/pv-c2-baseline/repo, so its panel
# data_paths are already cluster-absolute (data_sha256 unchanged, still verified
# on load).
experiment_name: c2-baseline-matplotagent-multipanel-v1-gpt4omini
dataset_manifest: /mnt/shared/zechuan/pv-c2-baseline/repo/nature_download/outputs/c2_multipanel_baseline/derived_multipanel_manifest.cluster.json
dataset_manifest_sha256: none
dataset_mode: legacy
artifact_root: /mnt/shared/zechuan/pv-c2-baseline/runs/c2_baseline_matplotagent_multipanel_v1_gpt4omini

methods:
  - name: matplotagent_multipanel
    schedule: best_of_n
    provider: experiments.external_baselines_multipanel:MultiPanelExternalBaselineProvider
    provider_options:
      baseline: matplotagent
      repo_path: /mnt/shared/zechuan/pv-c2-baseline/repo/baseline_repos/MatPlotAgent
      python_executable: /mnt/shared/zechuan/pv-c2-baseline/repo/.baseline_envs/matplotagent/bin/python
  - name: pheroviz_model_spec
    schedule: best_of_n
    provider: experiments.providers:UnifiedBenchmarkProvider
    provider_options:
      manifest_data_root: /mnt/shared/zechuan/pv-c2-baseline/repo
    memory_mode: none
    initial_generation: model_spec
    render_timeout_seconds: 120

backbones:
  - gpt-4o-mini

seeds:
  - 0
  - 1
  - 2

budgets:
  - type: renders
    value: 6

splits:
  - test

metric:
  version: programmatic-v2
  config:
    selection:
      metric: data_fidelity
      direction: maximize
